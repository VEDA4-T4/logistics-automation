name: C++ Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake make libopencv-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build