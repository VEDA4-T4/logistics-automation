name: C++ Format Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  clang-format:
    name: clang-format
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          # CubeMX-generated and third-party sources keep upstream formatting.
          FILES=$(find . \
            -type f \( \
              -name "*.cpp" -o \
              -name "*.cc" -o \
              -name "*.cxx" -o \
              -name "*.hpp" -o \
              -name "*.h" -o \
              -name "*.hh" \
            \) \
            -not -path "./build/*" \
            -not -path "./.git/*" \
            -not -path "./stm32/*/Core/*" \
            -not -path "./stm32/*/Drivers/*" \
            -not -path "./stm32/*/Middlewares/*" \
            -not -path "./device-rpi/kernel/*" \
            -not -path "./.git/*")

          if [ -z "$FILES" ]; then
            echo "No C/C++ files found."
            exit 0
          fi

          clang-format-18 --dry-run --Werror $FILES
