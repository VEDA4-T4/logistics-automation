name: Kernel Driver Check

on:
  push:
    branches:
      - main
    paths:
      - "device-rpi/kernel/vedauart/**"
      - ".github/workflows/kernel-driver-check.yml"
  pull_request:
    paths:
      - "device-rpi/kernel/vedauart/**"
      - ".github/workflows/kernel-driver-check.yml"

jobs:
  build:
    name: Build vedauart module and overlay
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel headers and Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic device-tree-compiler

      - name: Locate kernel headers
        id: kernel
        shell: bash
        run: |
          KDIR=$(
            find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' |
              sort -V |
              tail -n 1
          )
          test -n "$KDIR"
          echo "kdir=$KDIR" >> "$GITHUB_OUTPUT"

      - name: Build module and overlay
        working-directory: device-rpi/kernel/vedauart
        run: make KDIR="${{ steps.kernel.outputs.kdir }}"
